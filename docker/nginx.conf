# Main HTTP block
user www-data;   #added by omar khaled
worker_processes auto;


http {
    server_tokens off;
    # Largest legitimate request: a completion form with 10 images at 5 MB (+ overhead); the biggest
    # single file is a 20 MB PDF. Keep this equal to php.ini post_max_size.
    client_max_body_size 64M;
    include       mime.types;
    default_type  application/octet-stream;
    log_format    main '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';

    add_header    X-Frame-Options SAMEORIGIN;

    #logging
    access_log /dev/stdout main;
    error_log /dev/stderr error;


    # Server block
    server {
        client_max_body_size 64M;
        listen 8000;
        server_name localhost;
        root /var/www/html/public;

        index index.php;

        charset utf-8;


        location /health {
            access_log off;  # Disable logging for health checks
            add_header Content-Type text/plain;
            return 200 "healthy\n";  # Return 200 OK with a simple response
        }

        # Main location block (for static files and routing to PHP)
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP handling: ONLY the Laravel front controller is ever executed. Every other .php under
        # public/ (a dropped-in tool, an uploaded file) answers 404 instead of running.
        location = /index.php {
            #fastcgi_pass 127.0.0.1:9000;  # Using TCP to communicate with PHP-FPM
            fastcgi_pass unix:/var/run/php/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;  # Safer than $realpath_root
            include fastcgi_params;

            # Cloudflare gives up at ~100s, so a worker still busy after ~2 minutes is serving nobody.
            # Keep these in step with php-fpm request_terminate_timeout (www.conf).
            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout    120s;
            fastcgi_read_timeout    120s;
        }

        location ~ \.php$ {
            return 404;
        }

        # Security: Deny access to hidden files except .well-known
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Optional: Caching for static files (images, CSS, JS)
        location ~* \.(jpg|jpeg|png|gif|css|js|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }
    }
}

# Events block (required for Nginx to start)
events {
    worker_connections 1024;  # Adjust this value based on your needs
}
